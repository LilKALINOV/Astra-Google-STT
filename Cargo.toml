[package]
name = "web-stt"
version = "0.6.0"
edition = "2021"
license = "MIT"
authors = ["Lil KALINOV"]

[[bin]]
name = "web-stt"
path = "src/main.rs"

[dependencies]
astra-plugin-sdk = "0.6"
reqwest = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
